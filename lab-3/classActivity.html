<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style.css">
    <style>





  .btn-blue {
    background-color: blue;
    color: white;
  }






  /* #box {
  background-color: blue;
  padding: 20px;
} */

.heading {
  color: red;
}

/* .btn-green {
  background-color: green;

body {
  font-family: "Times New Roman", Times, serif;
}




.center-heading {
  text-align: center;
  text-transform: capitalize;
}
.outer-div {
  font-size: 25px;
}

.inner-div {
  font-size: 10px;
}



.navbar {
  height: 60px;
  background-color: #0f1111;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.logo {
  color: #f08804;
  font-size: 25px;
  font-weight: bold;
}

.nav-links a {
  color: #ffffff;
  text-decoration: none;
  margin: 0 15px;
}

.search-box {
  display: flex;
}

.search-box input {
  padding: 6px;
  border: none;
  border-radius: 4px 0 0 4px;
}

.search-btn {
  background-color: #f08804;
  color: #ffffff;
  border: none;
  padding: 6px 14px;
  border-radius: 0 4px 4px 0;
  cursor: pointer;
}

</style>
</head>
<body>




<div id="box">
  <h1 class="heading">Main Heading</h1>
  <h2 class="heading">Subheading One</h2>
  <h3 class="heading">Subheading Two</h3>
  
  <button class="btn-green">Green Button</button>
  
  <button class="btn-blue">Blue Button</button>
  
  <button style="background-color: pink; color: black;">Pink Button</button>
</div>





<nav class="navbar">
  <div class="logo">LogoText</div>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
  </div>
  <div class="search-box">
    <input type="text" placeholder="Search...">
    <button class="search-btn">Go</button>
  </div>
</nav>






</body>
</html>
